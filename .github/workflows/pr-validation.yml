name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.316
            10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LicenseSeat.sln --locked-mode

      - name: Build all maintained projects
        run: dotnet build LicenseSeat.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test tests/LicenseSeat.Tests/LicenseSeat.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
          retention-days: 7

  size-check:
    name: Package Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: src/LicenseSeat/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore src/LicenseSeat/LicenseSeat.csproj --locked-mode

      - name: Create and validate package
        shell: bash
        run: |
          dotnet pack src/LicenseSeat/LicenseSeat.csproj --configuration Release --no-restore --output artifacts/packages
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/LicenseSeat/LicenseSeat.csproj | head -1)
          package="artifacts/packages/LicenseSeat.${version}.nupkg"
          ./scripts/validate-nuget-package.py "$package" --version "$version"
          size=$(wc -c < "$package")
          size_kib=$((size / 1024))
          echo "Package size: ${size_kib} KiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 2097152 ]; then
            echo "::error::Package exceeds the enforced 2 MiB limit"
            exit 1
          fi

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick-check, size-check]
    if: always()

    steps:
      - name: Generate summary
        shell: bash
        env:
          QUICK_RESULT: ${{ needs.quick-check.result }}
          SIZE_RESULT: ${{ needs.size-check.result }}
        run: |
          {
            echo "## PR validation"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Locked build and tests | ${QUICK_RESULT} |"
            echo "| Package shape and size | ${SIZE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$QUICK_RESULT" != success ] || [ "$SIZE_RESULT" != success ]; then
            exit 1
          fi
