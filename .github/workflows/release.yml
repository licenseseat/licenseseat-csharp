name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate version and source metadata
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            version=${RELEASE_TAG#v}
          else
            version=$REQUESTED_VERSION
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid semantic version"
            exit 1
          fi

          project_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/LicenseSeat/LicenseSeat.csproj | head -1)
          unity_version=$(python3 -c 'import json; print(json.load(open("src/LicenseSeat.Unity/package.json", encoding="utf-8"))["version"])')
          if [ "$version" != "$project_version" ] || [ "$version" != "$unity_version" ]; then
            echo "::error::Release, SDK, and Unity package versions must match"
            exit 1
          fi
          if ! grep -Fq "## [$version]" src/LicenseSeat.Unity/CHANGELOG.md; then
            echo "::error::Unity changelog has no entry for the release version"
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test, and package once
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            9.0.316
            10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LicenseSeat.sln --locked-mode

      - name: Build all maintained projects
        run: dotnet build LicenseSeat.sln --configuration Release --no-restore

      - name: Validate Unity package and compile compatibility harness
        run: |
          ./scripts/validate-unity-sync.sh
          ./scripts/validate-unity-package.sh
          dotnet build tests/LicenseSeat.Unity.Compile/LicenseSeat.Unity.Compile.csproj --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test tests/LicenseSeat.Tests/LicenseSeat.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage
          --logger "trx;LogFileName=release-tests.trx"

      - name: Enforce coverage floor
        shell: bash
        run: |
          mapfile -t reports < <(find artifacts/coverage -name coverage.cobertura.xml -type f)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Cobertura report; found ${#reports[@]}"
            exit 1
          fi
          ./scripts/check-coverage.py "${reports[0]}" --minimum-lines 80 --minimum-branches 70

      - name: Create release package with SDK validation enabled
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          dotnet pack src/LicenseSeat/LicenseSeat.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion="$RELEASE_VERSION"
          -p:Version="$RELEASE_VERSION"

      - name: Validate exact release package
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          ./scripts/validate-nuget-package.py
          "artifacts/packages/LicenseSeat.${RELEASE_VERSION}.nupkg"
          --version "$RELEASE_VERSION"

      - name: Upload validated release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuget-release-${{ needs.validate.outputs.version }}
          path: |
            artifacts/packages/LicenseSeat.${{ needs.validate.outputs.version }}.nupkg
            artifacts/packages/LicenseSeat.${{ needs.validate.outputs.version }}.snupkg
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish validated package to NuGet
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: nuget-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout validation script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302

      - name: Download validated package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuget-release-${{ needs.validate.outputs.version }}
          path: artifacts/packages

      - name: Revalidate downloaded artifact
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          ./scripts/validate-nuget-package.py
          "artifacts/packages/LicenseSeat.${RELEASE_VERSION}.nupkg"
          --version "$RELEASE_VERSION"

      - name: NuGet trusted-publishing login
        id: nuget-login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push exact package to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/LicenseSeat.${RELEASE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json

  release-assets:
    name: Attach validated artifacts to GitHub release
    runs-on: ubuntu-latest
    needs: [validate, build, publish]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download validated package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuget-release-${{ needs.validate.outputs.version }}
          path: artifacts/packages

      - name: Upload exact release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/LicenseSeat.${{ needs.validate.outputs.version }}.nupkg
            artifacts/packages/LicenseSeat.${{ needs.validate.outputs.version }}.snupkg

  notify:
    name: Release summary
    runs-on: ubuntu-latest
    needs: [validate, publish]
    if: success()

    steps:
      - name: Write summary
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## Release published"
            echo
            echo "NuGet package: LicenseSeat ${RELEASE_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
