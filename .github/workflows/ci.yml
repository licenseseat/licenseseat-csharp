name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup supported .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.316
            10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LicenseSeat.sln --locked-mode

      - name: Build
        run: dotnet build LicenseSeat.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test tests/LicenseSeat.Tests/LicenseSeat.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: error
          retention-days: 7

  csharp-compatibility:
    name: C# 9 / .NET Standard compatibility (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [8.0.423, 9.0.316, 10.0.302]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.sdk }}
          cache: true
          cache-dependency-path: src/LicenseSeat/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore src/LicenseSeat/LicenseSeat.csproj --locked-mode

      - name: Compile public SDK as C# 9 / .NET Standard 2.0
        run: >-
          dotnet build src/LicenseSeat/LicenseSeat.csproj
          --no-restore
          --configuration Release
          --framework netstandard2.0
          -p:LangVersion=9.0

  unity:
    name: Unity package static compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: tests/LicenseSeat.Unity.Compile/packages.lock.json

      - name: Validate Unity Core sync
        run: ./scripts/validate-unity-sync.sh

      - name: Validate Unity package and vendored dependency integrity
        run: ./scripts/validate-unity-package.sh

      - name: Restore compatibility harness in locked mode
        run: dotnet restore tests/LicenseSeat.Unity.Compile/LicenseSeat.Unity.Compile.csproj --locked-mode

      - name: Compile Unity runtime, editor, samples, and tests with C# 9
        run: >-
          dotnet build tests/LicenseSeat.Unity.Compile/LicenseSeat.Unity.Compile.csproj
          --no-restore
          --configuration Release

  quality:
    name: Formatting & analyzers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore LicenseSeat.sln --locked-mode

      - name: Verify formatting
        run: dotnet format LicenseSeat.sln --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build with analyzers and warnings as errors
        run: >-
          dotnet build LicenseSeat.sln
          --no-restore
          --configuration Release
          -p:TreatWarningsAsErrors=true

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.316
            10.0.302
          cache: true
          cache-dependency-path: |
            src/LicenseSeat/packages.lock.json
            tests/LicenseSeat.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore tests/LicenseSeat.Tests/LicenseSeat.Tests.csproj --locked-mode

      - name: Run tests with branch coverage
        run: >-
          dotnet test tests/LicenseSeat.Tests/LicenseSeat.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage
          --logger "trx;LogFileName=coverage-tests.trx"

      - name: Enforce coverage floor
        shell: bash
        run: |
          mapfile -t reports < <(find artifacts/coverage -mindepth 2 -maxdepth 2 -name coverage.cobertura.xml -type f)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Cobertura report; found ${#reports[@]}"
            exit 1
          fi
          ./scripts/check-coverage.py "${reports[0]}" --minimum-lines 80 --minimum-branches 70

      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 14

  package:
    name: NuGet package validation
    runs-on: ubuntu-latest
    needs: [build, csharp-compatibility, unity, quality, coverage]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: src/LicenseSeat/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore src/LicenseSeat/LicenseSeat.csproj --locked-mode

      - name: Create package with SDK validation enabled
        run: >-
          dotnet pack src/LicenseSeat/LicenseSeat.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages

      - name: Validate exact package contents and provenance metadata
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/LicenseSeat/LicenseSeat.csproj | head -1)
          ./scripts/validate-nuget-package.py "artifacts/packages/LicenseSeat.${version}.nupkg" --version "$version"
          size=$(wc -c < "artifacts/packages/LicenseSeat.${version}.nupkg")
          if [ "$size" -gt 2097152 ]; then
            echo "::error::NuGet package exceeds 2 MiB"
            exit 1
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies with NuGet audit enabled
        run: dotnet restore LicenseSeat.sln --locked-mode

      - name: Fail on any known direct or transitive vulnerability
        shell: bash
        run: |
          dotnet package list --project LicenseSeat.sln --vulnerable --include-transitive --format json --output-version 1 --no-restore > vulnerability-report.json
          if ! jq -e '[.projects[]? | .frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select(((.vulnerabilities // []) | length) > 0)] | length == 0' vulnerability-report.json >/dev/null; then
            echo "::error::A vulnerable NuGet dependency was detected"
            jq '.projects[]? | .frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select(((.vulnerabilities // []) | length) > 0)' vulnerability-report.json
            exit 1
          fi

      - name: Record deprecated dependency evidence
        run: >-
          dotnet package list --project LicenseSeat.sln
          --deprecated
          --include-transitive
          --format json
          --output-version 1
          --no-restore
          > deprecated-report.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: |
            vulnerability-report.json
            deprecated-report.json
          if-no-files-found: warn
          retention-days: 14
